name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Set up Node.js for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/public.js
          node --check app/static/theme.js
      - name: Run browser tests against a disposable database
        run: python tests/run_browser.py
      - name: Check Compose configuration
        env:
          ADMIN_PASSWORD: compose-validation-password-only
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

  publish:
    name: Publish AMD64 and ARM64 image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/phillipunzen/app-dashboard
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Smoke test the published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "ghcr.io/phillipunzen/app-dashboard@${IMAGE_DIGEST}"
          docker run --detach --name dashboard-smoke \
            --env ADMIN_PASSWORD=container-smoke-test-password \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "ghcr.io/phillipunzen/app-dashboard@${IMAGE_DIGEST}"
          trap 'docker logs dashboard-smoke; docker rm --force --volumes dashboard-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec dashboard-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"; then
              break
            fi
            sleep 2
          done
          docker exec dashboard-smoke python -c "import urllib.request; page=urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).read(); assert b'App Dashboard' in page"
          docker image inspect "ghcr.io/phillipunzen/app-dashboard@${IMAGE_DIGEST}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.source" }}'
      - name: Published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### App Dashboard image' >> "$GITHUB_STEP_SUMMARY"
          echo 'Image: `ghcr.io/phillipunzen/app-dashboard`' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Platforms: `linux/amd64`, `linux/arm64`' >> "$GITHUB_STEP_SUMMARY"
